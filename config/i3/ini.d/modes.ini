set $resize_step 20
mode "resize" {
        bindsym k resize grow   height $resize_step px
        bindsym j resize shrink height $resize_step px
        bindsym h resize shrink width  $resize_step px
        bindsym l resize grow   width  $resize_step px
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"

mode "tag" {
        bindsym 1 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace01
        bindsym 2 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace02
        bindsym 3 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace03
        bindsym 4 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace04
        bindsym 5 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace05
        bindsym 6 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace06
        bindsym 7 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace07
        bindsym 8 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace08
        bindsym 9 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace09
        bindsym 0 exec --no-startup-id $HOME/.bin/i3-tag toggle $workspace10
        bindsym Return mode "default"; exec --no-startup-id $HOME/.bin/i3-tag dismiss
        bindsym Escape mode "default"; exec --no-startup-id $HOME/.bin/i3-tag dismiss
        bindsym $mod+Shift+t mode "default"; exec --no-startup-id $HOME/.bin/i3-tag dismiss
}

bindsym $mod+Shift+t mode "tag"; exec --no-startup-id $HOME/.bin/i3-tag enter
