set $monitor01 DP-2
set $monitor02 DP-1

bindsym $mod+Shift+i exec ~/.bin/launch-or-raise --binary firefox --selector firefox
bindsym $mod+Shift+s exec ~/.bin/launch-or-raise --binary discord --selector discord
bindsym $mod+Shift+slash exec ~/.bin/clip-record toggle-buffer
bindsym $mod+slash exec ~/.bin/clip-record capture-buffer

#exec_always --no-startup-id "xrandr --output DisplayPort-1 --primary --output DisplayPort-0 --right-of DisplayPort-1"
exec_always --no-startup-id "xrandr --output DP-2 --primary --output DP-1 --right-of DP-2"

# Journal is a personal-machine tool; kept host-only (not used at work).
bindsym $mod+x                      exec --no-startup-id ~/.bin/tool/tool-journal
bindsym $mod+Shift+x                exec --no-startup-id ~/.bin/tool/tool-journal new

# Assignments
assign [class="firefox"] $workspace06
assign [class="discord"] $workspace09
assign [class="signal-desktop"] $workspace10
